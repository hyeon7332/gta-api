server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

upload:
  owned-transport:
    path: /home/ubuntu/gta-upload/owned-transport
    url-prefix: /uploads/owned-transport