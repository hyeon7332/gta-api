spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB		

mybatis:
  mapper-locations: classpath:/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: my-secret-key-12345678901234567890
  expiration: 3600000 # 1시간 (ms)